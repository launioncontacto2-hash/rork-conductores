name: DORI Vehicle Telemetry TEST

on:
  workflow_dispatch:
  push:
    branches:
      - feat/dori-conductores-live-vehicle-e2e

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push TEST migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
        run: supabase db push --project-ref yyxzuiantrmoyozetswv --password "$SUPABASE_DB_PASSWORD"
      - name: Inject TEST token hash in working copy
        env:
          AGENT_TOKEN: ${{ secrets.DORI_VEHICLE_AGENT_TOKEN_TEST }}
        run: |
          set -euo pipefail
          test -n "$AGENT_TOKEN"
          TOKEN_HASH="$(printf '%s' "$AGENT_TOKEN" | sha256sum | awk '{print $1}')"
          sed -i "s/__DORI_AGENT_TOKEN_SHA256__/$TOKEN_HASH/" supabase/functions/dori-vehicle-telemetry-ingest/index.ts
          ! grep -q '__DORI_AGENT_TOKEN_SHA256__' supabase/functions/dori-vehicle-telemetry-ingest/index.ts
      - name: Deploy ingest function to TEST
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy dori-vehicle-telemetry-ingest --project-ref yyxzuiantrmoyozetswv --no-verify-jwt
      - name: Smoke unauthorized request
        env:
          SUPABASE_URL: https://yyxzuiantrmoyozetswv.supabase.co
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/dori-vehicle-telemetry-ingest" -H 'content-type: application/json' -H 'x-dori-agent-token: invalid-test-token' -d '{}')
          test "$code" = "401"
      - name: Smoke vehicle allowlist
        env:
          SUPABASE_URL: https://yyxzuiantrmoyozetswv.supabase.co
          AGENT_TOKEN: ${{ secrets.DORI_VEHICLE_AGENT_TOKEN_TEST }}
        run: |
          set -euo pipefail
          test -n "$AGENT_TOKEN"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/dori-vehicle-telemetry-ingest" -H 'content-type: application/json' -H "x-dori-agent-token: $AGENT_TOKEN" -d '{"vehicle_code":"DMP-999","soc_percent":50,"odometer_km":1,"sequence":1,"captured_at":"2026-09-30T20:00:00Z"}')
          test "$code" = "403"

name: UBER Test iOS

on:
  pull_request:
    paths:
      - "uber-test/**"
      - ".github/workflows/uber-test-ios.yml"
  push:
    branches: ["codex/uber-test-console", "feat/copilot-uber-test-bridge", "codex/uber-test-identity-link-reconciliation", "codex/uber-test-single-iphone-e2e"]
    paths:
      - "uber-test/**"
      - ".github/workflows/uber-test-ios.yml"
  workflow_dispatch:

jobs:
  test-core:
    name: UBER Test core and iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests
        run: node --test uber-test/scripts/*.test.cjs
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Swift package tests
        run: swift test
        working-directory: uber-test
      - name: Validate project and entitlements
        run: |
          xcodebuild -project uber-test/UberTest.xcodeproj -list
          plutil -lint uber-test/UberTestApp/UberTest.entitlements
      - name: iOS simulator build
        env:
          UBER_TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          UBER_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: xcodebuild -project uber-test/UberTest.xcodeproj -scheme UberTest -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO UBER_TEST_SUPABASE_URL="$UBER_TEST_SUPABASE_URL" UBER_TEST_SUPABASE_PUBLISHABLE_KEY="$UBER_TEST_SUPABASE_PUBLISHABLE_KEY" INFOPLIST_KEY_UBER_TEST_SUPABASE_URL="$UBER_TEST_SUPABASE_URL" INFOPLIST_KEY_UBER_TEST_SUPABASE_PUBLISHABLE_KEY="$UBER_TEST_SUPABASE_PUBLISHABLE_KEY" build

  testflight:
    name: Archive and distribute UBER Test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/codex/uber-test-identity-link-reconciliation' || github.ref == 'refs/heads/codex/uber-test-single-iphone-e2e'))
    needs: test-core
    runs-on: macos-15
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Install Apple signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/uber-test-signing.keychain-db"
          KEYCHAIN_PASSWORD="uber-test-${GITHUB_RUN_ID}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-distribution.p12"
          security import "$RUNNER_TEMP/apple-distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Validate UBER TEST embedded configuration inputs
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TEST_SUPABASE_URL" || { echo "Missing TEST_SUPABASE_URL" >&2; exit 1; }
          test "$TEST_SUPABASE_URL" = "https://yyxzuiantrmoyozetswv.supabase.co" || { echo "Unexpected TEST_SUPABASE_URL" >&2; exit 1; }
          test -n "$TEST_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing TEST_SUPABASE_PUBLISHABLE_KEY" >&2; exit 1; }
          [[ "$TEST_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || { echo "TEST_SUPABASE_PUBLISHABLE_KEY is not a publishable client key" >&2; exit 1; }
          echo "UBER TEST CONFIG INPUTS — PASS"
      - name: Supabase Auth URL and reachability smoke
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          auth_url="${TEST_SUPABASE_URL%/}/auth/v1/token?grant_type=password"
          response_file="$RUNNER_TEMP/uber-test-auth-smoke.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -X POST "$auth_url" \
            -H "apikey: $TEST_SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"email":"uber-test-invalid@example.invalid","password":"deliberately-invalid"}')"
          test "$status" = "400" || { echo "Expected Supabase Auth invalid-credentials response 400, got $status" >&2; cat "$response_file"; exit 1; }
          grep -Eq 'invalid_credentials|Invalid login credentials' "$response_file" || { echo 'Supabase Auth smoke did not return a credential error' >&2; cat "$response_file"; exit 1; }
          echo "AUTH URL — PASS"
          echo "PUBLISHABLE KEY — PASS"
          echo "SUPABASE AUTH REACHABLE — PASS"
      - name: Archive
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$AUTH_KEY_PATH"
          xcodebuild -project uber-test/UberTest.xcodeproj -scheme UberTest -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/UberTest.xcarchive" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" UBER_TEST_SUPABASE_URL="$TEST_SUPABASE_URL" UBER_TEST_SUPABASE_PUBLISHABLE_KEY="$TEST_SUPABASE_PUBLISHABLE_KEY" INFOPLIST_KEY_UBER_TEST_SUPABASE_URL="$TEST_SUPABASE_URL" INFOPLIST_KEY_UBER_TEST_SUPABASE_PUBLISHABLE_KEY="$TEST_SUPABASE_PUBLISHABLE_KEY" DEVELOPMENT_TEAM=H9S3662NMB CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="UBER Test App Store Push v2" -allowProvisioningUpdates -authenticationKeyPath "$AUTH_KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" archive
      - name: Inspect archived embedded configuration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          APP_PLIST="$RUNNER_TEMP/UberTest.xcarchive/Products/Applications/UberTest.app/Info.plist"
          test -f "$APP_PLIST" || { echo "Archived UBER Test Info.plist missing" >&2; exit 1; }
          embedded_url=$(/usr/libexec/PlistBuddy -c 'Print :UBER_TEST_SUPABASE_URL' "$APP_PLIST")
          embedded_key=$(/usr/libexec/PlistBuddy -c 'Print :UBER_TEST_SUPABASE_PUBLISHABLE_KEY' "$APP_PLIST")
          test -n "$embedded_url" && test -n "$embedded_key" || { echo "UBER TEST embedded configuration is empty" >&2; exit 1; }
          test "$embedded_url" = "$TEST_SUPABASE_URL" || { echo "Archived URL does not match TEST URL" >&2; exit 1; }
          test "$embedded_key" = "$TEST_SUPABASE_PUBLISHABLE_KEY" || { echo "Archived publishable key does not match TEST key" >&2; exit 1; }
          echo "UBER TEST EMBEDDED CONFIG — PASS"
      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$AUTH_KEY_PATH"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UberTest.xcarchive" -exportOptionsPlist uber-test/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$AUTH_KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          upload_log="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/UberTest.ipa" -t ios --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" 2>&1 | tee "$upload_log"
          upload_status=${PIPESTATUS[0]}
          set -e
          if [ "$upload_status" -ne 0 ] || grep -q "UPLOAD FAILED\|Validation failed\|Failed to upload package" "$upload_log"; then
            echo "App Store Connect rejected the UBER Test IPA."
            exit 1
          fi
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}

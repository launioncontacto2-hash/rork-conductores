name: iOS TestFlight distribution

on:
  workflow_dispatch:
    inputs:
      distribution_mode:
        description: Choose validation, archive preparation, or an authorized TestFlight upload
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - archive-only
          - upload-testflight

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_PATH: ios-turno-ev/TurnoEV.xcodeproj
  SCHEME: TurnoEV
  APPLE_TEAM_ID: H9S3662NMB
  BUNDLE_ID: com.turnoev.mobility
  EXPECTED_TEST_SUPABASE_URL: https://yyxzuiantrmoyozetswv.supabase.co
  EXPECTED_TEST_ENVIRONMENT_ID: 9f8d4a52-0f0e-4a3f-9a1e-2c6f5b8d7e10
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  validate:
    name: Validate with Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
      SOURCE_PACKAGES_PATH: ${{ github.workspace }}/SourcePackages
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          grep -q '^Xcode 26\.6$' <<< "$xcode_version"
          printf '%s\n' "$xcode_version"

      - name: Validate distribution AppIcon
        run: node scripts/validate-ios-app-icon.cjs

      - name: Verify canonical Copilot resource
        run: node scripts/sync-copilot-ios-resource.cjs --check

      - name: Run Copilot Node tests
        run: >-
          node --test
          scripts/copilot.test.cjs
          scripts/copilot-simulator.test.cjs
          scripts/copilot-ios-resource.test.cjs

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"

      - name: Select and boot an available iPhone simulator
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import shlex
          import subprocess

          inventory = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          candidates = []
          for runtime, devices in inventory.get("devices", {}).items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(".iOS-")[-1].split("-"))
              for device in devices:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"], runtime))

          if not candidates:
              raise SystemExit("No available iPhone simulator was found")

          version, name, udid, runtime = max(candidates, key=lambda item: item[0])
          with open("selected-simulator.env", "w", encoding="utf-8") as stream:
              stream.write(f"SIMULATOR_NAME={shlex.quote(name)}\n")
              stream.write(f"SIMULATOR_UDID={shlex.quote(udid)}\n")
              stream.write(
                  f"SIMULATOR_RUNTIME={shlex.quote(runtime.rsplit('.', 1)[-1].replace('-', ' '))}\n"
              )
          PY
          source selected-simulator.env
          {
            echo "SIMULATOR_NAME=$SIMULATOR_NAME"
            echo "SIMULATOR_UDID=$SIMULATOR_UDID"
            echo "SIMULATOR_RUNTIME=$SIMULATOR_RUNTIME"
          } >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build TurnoEV and tests for iOS Simulator
        run: |
          set -euo pipefail
          source selected-simulator.env
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify canonical resource in app bundle
        run: |
          set -euo pipefail
          bundled_resource="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/TurnoEV.app/dori-copilot.js"
          test -f "$bundled_resource"
          cmp supabase/functions/_shared/dori-copilot.js "$bundled_resource"

      - name: Run DORICopilotContractTests
        run: |
          set -euo pipefail
          source selected-simulator.env
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -only-testing:TurnoEVTests/DORICopilotContractTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run TurnoEVTests
        run: |
          set -euo pipefail
          source selected-simulator.env
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -only-testing:TurnoEVTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Shut down simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: xcrun simctl shutdown "$SIMULATOR_UDID" || true

  distribute:
    name: Archive and distribute TurnoEV
    if: inputs.distribution_mode != 'validate-only'
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      ARCHIVE_PATH: ${{ github.workspace }}/artifacts/TurnoEV.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/artifacts/export
      SOURCE_PACKAGES_PATH: ${{ github.workspace }}/SourcePackages
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcodebuild -version | grep -q '^Xcode 26\.6$'

      - name: Check required signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=(APPLE_DISTRIBUTION_CERTIFICATE_BASE64)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD)
          [[ -n "$PROFILE_BASE64" ]] || missing+=(APPLE_PROVISIONING_PROFILE_BASE64)
          [[ -n "$TEST_SUPABASE_URL" ]] || missing+=(TEST_SUPABASE_URL)
          [[ -n "$TEST_SUPABASE_PUBLISHABLE_KEY" ]] || missing+=(TEST_SUPABASE_PUBLISHABLE_KEY)
          if [[ "${{ inputs.distribution_mode }}" == "upload-testflight" ]]; then
            [[ -n "$API_KEY_ID" ]] || missing+=(APP_STORE_CONNECT_API_KEY_ID)
            [[ -n "$API_ISSUER_ID" ]] || missing+=(APP_STORE_CONNECT_API_ISSUER_ID)
            [[ -n "$API_PRIVATE_KEY_BASE64" ]] || missing+=(APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64)
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          [[ "$TEST_SUPABASE_URL" == "$EXPECTED_TEST_SUPABASE_URL" ]] || {
            echo 'TEST_SUPABASE_URL does not identify the authorized TEST project.' >&2
            exit 1
          }
          [[ "$TEST_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || {
            echo 'TEST_SUPABASE_PUBLISHABLE_KEY is not a client publishable key.' >&2
            exit 1
          }
          [[ "$EXPECTED_TEST_ENVIRONMENT_ID" == '9f8d4a52-0f0e-4a3f-9a1e-2c6f5b8d7e10' ]] || {
            echo 'The authorized TEST environment identifier changed unexpectedly.' >&2
            exit 1
          }

      - name: Install Apple Distribution certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          profile_source_path="$RUNNER_TEMP/app-store.mobileprovision"
          profile_plist_path="$RUNNER_TEMP/app-store-profile.plist"
          keychain_path="$RUNNER_TEMP/testflight-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_source_path"
          security cms -D -i "$profile_source_path" > "$profile_plist_path"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist_path")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist_path")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist_path")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist_path")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist_path" 2>/dev/null || true)"
          beta_reports="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:beta-reports-active' "$profile_plist_path" 2>/dev/null || true)"

          [[ "$profile_team" == "$APPLE_TEAM_ID" ]]
          [[ "$profile_app_id" == "$APPLE_TEAM_ID.$BUNDLE_ID" ]]
          [[ "$get_task_allow" == "false" ]]
          [[ "$beta_reports" == "true" ]]
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist_path" >/dev/null 2>&1; then
            echo 'The provisioning profile is not an App Store Connect distribution profile.' >&2
            exit 1
          fi

          original_keychain="$(security default-keychain -d user | tr -d '"')"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security find-identity -v -p codesigning "$keychain_path" | grep -q 'Apple Distribution'

          profile_install_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_install_path="$profile_install_directory/$profile_uuid.mobileprovision"
          mkdir -p "$profile_install_directory"
          cp "$profile_source_path" "$profile_install_path"

          {
            echo "SIGNING_KEYCHAIN_PATH=$keychain_path"
            echo "ORIGINAL_DEFAULT_KEYCHAIN=$original_keychain"
            echo "PROVISIONING_PROFILE_NAME=$profile_name"
            echo "PROVISIONING_PROFILE_PATH=$profile_install_path"
          } >> "$GITHUB_ENV"

      - name: Install App Store Connect API private key
        if: inputs.distribution_mode == 'upload-testflight'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          api_key_directory="$HOME/.appstoreconnect/private_keys"
          api_key_path="$api_key_directory/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$api_key_directory"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"

      - name: Archive signed Release build
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DORI_SUPABASE_URL="$TEST_SUPABASE_URL" \
            DORI_SUPABASE_PUBLISHABLE_KEY="$TEST_SUPABASE_PUBLISHABLE_KEY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH"

      - name: Verify embedded TEST configuration
        run: |
          set -euo pipefail
          app_plist="$ARCHIVE_PATH/Products/Applications/TurnoEV.app/Info.plist"
          test -f "$app_plist"
          embedded_url="$(/usr/libexec/PlistBuddy -c 'Print :EXPO_PUBLIC_SUPABASE_URL' "$app_plist")"
          embedded_key="$(/usr/libexec/PlistBuddy -c 'Print :EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY' "$app_plist")"
          [[ "$embedded_url" == "$EXPECTED_TEST_SUPABASE_URL" ]]
          [[ "$embedded_key" == sb_publishable_* ]]
          codesign --verify --deep --strict "$ARCHIVE_PATH/Products/Applications/TurnoEV.app"

      - name: Export IPA for App Store Connect
        run: |
          set -euo pipefail
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options_path" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$export_options_path"
          ipa_path="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TurnoEV-TestFlight-${{ github.run_number }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Validate and upload to TestFlight
        if: inputs.distribution_mode == 'upload-testflight'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean signing material
        if: always()
        run: |
          set +e
          if [[ -n "${PROVISIONING_PROFILE_PATH:-}" ]]; then
            rm -f "$PROVISIONING_PROFILE_PATH"
          fi
          if [[ -n "${APP_STORE_CONNECT_API_KEY_PATH:-}" ]]; then
            rm -f "$APP_STORE_CONNECT_API_KEY_PATH"
          fi
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN"
          fi
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/app-store.mobileprovision" \
            "$RUNNER_TEMP/app-store-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"

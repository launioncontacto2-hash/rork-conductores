name: DORI Copiloto restore human TEST credentials

on:
  push:
    branches:
      - feat/copilot-cross-test-foundation
    paths:
      - .github/copilot-restore.trigger

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and update only approved TEST identities
        env:
          SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
          TEMP_PASSWORD: ${{ secrets.COPILOT_RESTORE_TEMP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY_TEST"
          test -n "$TEMP_PASSWORD"
          SUPABASE_SERVICE_ROLE_KEY_TEST="$SUPABASE_SERVICE_ROLE_KEY_TEST" \
          TEMP_PASSWORD="$TEMP_PASSWORD" \
          node --input-type=module <<'NODE'
          const base = 'https://yyxzuiantrmoyozetswv.supabase.co';
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY_TEST;
          const expected = [
            ['jorge.ramos@dori.mx', process.env.TEMP_PASSWORD],
            ['consola@dori.mx', process.env.TEMP_PASSWORD],
            ['supervision.pue@dori.mx', process.env.TEMP_PASSWORD],
          ];
          const headers = { apikey: key, authorization: `Bearer ${key}` };
          const response = await fetch(`${base}/auth/v1/admin/users?per_page=100`, { headers });
          if (!response.ok) throw new Error(`Admin Auth list failed: HTTP ${response.status}`);
          const payload = await response.json();
          for (const [email, password] of expected) {
            const matches = (payload.users ?? []).filter((user) => user.email === email);
            if (matches.length !== 1) throw new Error(`Expected exactly one approved TEST identity for ${email}`);
            const user = matches[0];
            if (user.email !== email || !user.id) throw new Error(`Identity verification failed for ${email}`);
            const update = await fetch(`${base}/auth/v1/admin/users/${user.id}`, {
              method: 'PUT',
              headers: { ...headers, 'content-type': 'application/json' },
              body: JSON.stringify({ password, email_confirm: true }),
            });
            if (!update.ok) throw new Error(`Admin Auth update failed for ${email}: HTTP ${update.status}`);
          }
          console.log('PASS: exactly three approved TEST identities updated; no profile or role data changed.');
          NODE

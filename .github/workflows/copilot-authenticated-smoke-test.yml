name: DORI Copiloto authenticated TEST smoke

on:
  workflow_dispatch:
  push:
    branches: [feat/copilot-cross-test-foundation]
    paths:
      - '.github/workflows/copilot-authenticated-smoke-test.yml'
      - 'docs/DORI_COPILOTO_CANONICO.md'
      - 'supabase/migrations/20260921170000_dori_copilot_events_reconcile.sql'
      - 'supabase/functions/dori-copilot-simulation/index.ts'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://yyxzuiantrmoyozetswv.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_kNOz-Pfffc7kY-615uPM1A_Kb1FkL85
      SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical and TEST target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\*\*Versión:\*\* 1.3' docs/DORI_COPILOTO_CANONICO.md
          [[ "$SUPABASE_URL" == "https://yyxzuiantrmoyozetswv.supabase.co" ]]
          test -n "$SUPABASE_PUBLISHABLE_KEY"

      - name: Install isolated smoke dependency
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.115.0

      - name: Run authenticated smoke with isolated automation identities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');

          const url = process.env.SUPABASE_URL;
          const anon = process.env.SUPABASE_PUBLISHABLE_KEY;
          const serviceRole = process.env.SUPABASE_SERVICE_ROLE_KEY_TEST;
          const admin = createClient(url, serviceRole, { auth: { persistSession: false } });
          const anonClient = createClient(url, anon, { auth: { persistSession: false } });
          const run = Date.now().toString(36);
          const identities = Object.fromEntries(['console','driver','driverB','supervisor'].map((name) => [name, { email: `copilot-smoke-${name}-${run}@local.test`, password: crypto.randomUUID() + crypto.randomUUID() }]));
          const created = { users: [], profiles: [], memberships: [], drivers: [] };
          const clients = {};
          const assert = (name, condition, detail = '') => {
            if (!condition) throw new Error(`${name}: ${detail}`);
            console.log(`PASS ${name}`);
          };
          assert('service role configured', !!serviceRole, 'missing TEST service role');
          async function provision() {
            const { data: envs, error: envError } = await admin.from('environments').select('id,code').limit(20);
            assert('TEST environment', !envError && !!envs?.length, envError?.message || 'missing environments');
            const env = envs.find((x) => x.code === 'test') || envs[0];
            const { data: stations, error: stationError } = await admin.from('stations').select('id,environment_id,code').eq('environment_id', env.id).limit(20);
            assert('TEST station', !stationError && !!stations?.length, stationError?.message || 'missing station');
            const station = stations[0];
            const ids = { console: crypto.randomUUID(), driver: crypto.randomUUID(), driverB: crypto.randomUUID(), supervisor: crypto.randomUUID(), mc: crypto.randomUUID(), md: crypto.randomUUID(), mdB: crypto.randomUUID(), ms: crypto.randomUUID(), dp: crypto.randomUUID(), dpB: crypto.randomUUID() };
            for (const name of Object.keys(identities)) { const { data, error } = await admin.auth.admin.createUser({ email: identities[name].email, password: identities[name].password, email_confirm: true }); assert(`create automation auth ${name}`, !error && !!data.user, error?.message || 'create failed'); identities[name].userId = data.user.id; created.users.push(data.user.id); }
            const profiles = [{ id: ids.console, environment_id: env.id, auth_user_id: identities.console.userId, employee_number: `LAB-${run}-CONSOLE`, display_name: 'Copiloto Smoke Console', status: 'active' }, { id: ids.driver, environment_id: env.id, auth_user_id: identities.driver.userId, employee_number: `LAB-${run}-DRIVER-A`, display_name: 'Copiloto Smoke Driver A', status: 'active' }, { id: ids.driverB, environment_id: env.id, auth_user_id: identities.driverB.userId, employee_number: `LAB-${run}-DRIVER-B`, display_name: 'Copiloto Smoke Driver B', status: 'active' }, { id: ids.supervisor, environment_id: env.id, auth_user_id: identities.supervisor.userId, employee_number: `LAB-${run}-SUPERVISOR`, display_name: 'Copiloto Smoke Supervisor', status: 'active' }];
            let q = await admin.from('profiles').insert(profiles); assert('create automation profiles', !q.error, q.error?.message || 'insert failed'); created.profiles.push(...profiles.map((x) => x.id));
            const memberships = [{ id: ids.mc, environment_id: env.id, profile_id: ids.console, station_id: station.id, role: 'console', starts_at: '2000-01-01T00:00:00Z', shift_group: 'weekday', shift_slot: 'morning' }, { id: ids.md, environment_id: env.id, profile_id: ids.driver, station_id: station.id, role: 'driver', starts_at: '2000-01-01T00:00:00Z', shift_group: 'weekday', shift_slot: 'morning' }, { id: ids.mdB, environment_id: env.id, profile_id: ids.driverB, station_id: station.id, role: 'driver', starts_at: '2000-01-01T00:00:00Z', shift_group: 'weekday', shift_slot: 'morning' }, { id: ids.ms, environment_id: env.id, profile_id: ids.supervisor, station_id: station.id, role: 'supervisor', starts_at: '2000-01-01T00:00:00Z', shift_group: 'weekday', shift_slot: 'morning' }];
            q = await admin.from('staff_memberships').insert(memberships); assert('create automation memberships', !q.error, q.error?.message || 'insert failed'); created.memberships.push(...memberships.map((x) => x.id));
            q = await admin.from('driver_profiles').insert([{ id: ids.dp, environment_id: env.id, station_id: station.id, profile_id: ids.driver, membership_id: ids.md, employee_number: `LAB-${run}-DRIVER-A`, status: 'active' }, { id: ids.dpB, environment_id: env.id, station_id: station.id, profile_id: ids.driverB, membership_id: ids.mdB, employee_number: `LAB-${run}-DRIVER-B`, status: 'active' }]); assert('create automation driver profiles', !q.error, q.error?.message || 'insert failed'); created.drivers.push(ids.dp, ids.dpB);
            identities.console.profileId = ids.console; identities.driver.profileId = ids.driver; identities.driver.driverProfileId = ids.dp; identities.driverB.profileId = ids.driverB; identities.driverB.driverProfileId = ids.dpB; identities.supervisor.profileId = ids.supervisor;
          }
          async function cleanup() { try { await admin.from('driver_profiles').delete().in('id', created.drivers); await admin.from('staff_memberships').delete().in('id', created.memberships); await admin.from('profiles').delete().in('id', created.profiles); for (const id of created.users) await admin.auth.admin.deleteUser(id); console.log('PASS ephemeral cleanup'); } catch (e) { console.error(`CLEANUP_FAILED ${e.message}`); } }
          async function login(name) {
            const { email, password, userId } = identities[name];
            const client = createClient(url, anon, { auth: { persistSession: false, autoRefreshToken: false } });
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            assert(`login ${name}`, !error && !!data.session?.access_token, error?.message || 'no session');
            clients[name] = { client, token: data.session.access_token, userId };
          }
          async function rest(client, table, query) {
            const { data, error } = await client.from(table).select(query).limit(10);
            if (error) throw new Error(`${table}: ${error.message}`);
            return data;
          }
          async function edge(name, body, fn = 'dori-copilot-simulation') {
            const r = await fetch(`${url}/functions/v1/${fn}`, {
              method: 'POST',
              headers: { authorization: `Bearer ${clients[name].token}`, apikey: anon, 'content-type': 'application/json' },
              body: JSON.stringify(body),
            });
            const data = await r.json().catch(() => ({}));
            return { status: r.status, data };
          }
          (async () => {
            await provision();
            await login('console');
            await login('driver');
            await login('driverB');
            await login('supervisor');

            const { data: driverProfile, error: driverProfileError } = await clients.driver.client.from('driver_profiles').select('id,profile_id,station_id,environment_id,status,employee_number').eq('id', identities.driver.driverProfileId).maybeSingle();
            const { data: profile, error: profileError } = await clients.driver.client.from('profiles').select('id,environment_id,status').eq('id', identities.driver.profileId).maybeSingle();
            if (driverProfileError || profileError) console.log(`identity query diagnostics: driver=${driverProfileError?.message || 'ok'}, profile=${profileError?.message || 'ok'}`);
            if (!driverProfile || !profile || driverProfile.profile_id !== profile.id) {
              console.log(`identity diagnostics: profileId=${profile?.id || 'none'}, driverProfileLink=${driverProfile?.profile_id || 'none'}`);
            }
            assert('driver identity scope', !!driverProfile && !!profile && driverProfile.profile_id === profile.id);

            const clocks = await rest(clients.console.client, 'test_clock', 'environment_id,anchor_simulated_at,is_paused,speed');
            const testClock = clocks.find((x) => x.environment_id === driverProfile.environment_id);
            const now = new Date(testClock?.anchor_simulated_at || Date.now());
            console.log(`TEST clock env=${driverProfile.environment_id} anchor=${testClock?.anchor_simulated_at || 'none'} paused=${testClock?.is_paused ?? 'none'} driverProfile=${driverProfile.id} station=${driverProfile.station_id}`);
            const shiftStart = new Date(now.getTime() - 3600000).toISOString();
            const shiftEnd = new Date(now.getTime() + 28800000).toISOString();
            const input = {
              trip: { fare: 240, pickupMinutes: 4, pickupKm: 1.2, tripMinutes: 35, tripKm: 18, origin: 'Centro', destination: 'Zona de oficinas', timestamp: now.toISOString() },
              market: { now: now.toISOString(), hour: now.getHours(), weekday: now.getDay() === 0 ? 7 : now.getDay(), originZone: 'Centro', destinationZone: 'Oficinas', demand: 'normal', historicalDemand: null, forecastDemand: null, nextWaitMinutes: 8, destinationValue: 85, repositionKm: 1, repositionMinutes: 3, traffic: null, events: null, weather: null },
              vehicle: { vehicleId: 'gha-test-vehicle', batteryPercent: 80, rangeKm: 200, consumptionKwhPerKm: 0.16, energyCostPerKm: 0.6, odometerKm: 20000, distanceToStationKm: 3, destinationToStationKm: 8, requiredReturnAt: shiftEnd },
              driver: { driverId: profile.id, shiftStart, shiftEnd, remainingMinutes: 480, connectedMinutes: 60, accumulatedIncome: 300, completedTrips: 3 },
              source: 'simulated'
            };
            const key = `gha-${Date.now()}-create`;
            const created = await edge('console', { operation: 'create', idempotencyKey: key, testCaseId: `gha-${Date.now()}`, driverProfileId: driverProfile.id, input, expected: { recommendation: 'RECOMENDADO', reasonCode: 'lab' }, expiresAt: new Date(now.getTime() + 120000).toISOString() });
            assert('console create', [200, 201].includes(created.status), JSON.stringify(created.data));
            const caseId = created.data.case?.id || created.data.id;
            assert('case pending', created.data.case?.status === 'pending' || created.data.status === 'pending');

            const received = await edge('driver', { operation: 'next', caseId });
            assert('driver receive', received.status === 200 && received.data.case?.id === caseId, JSON.stringify(received.data));
            const receivedCaseId = received.data.case?.id || caseId;
            const receivedText = JSON.stringify(received.data);
            assert('EXPECTED hidden', !/expected|expectation|classification/i.test(receivedText));
            const otherReceive = await edge('driverB', { operation: 'next', caseId });
            assert('driver B isolation', [403, 404].includes(otherReceive.status) || (otherReceive.status === 200 && !otherReceive.data.case), JSON.stringify(otherReceive.data));
            const otherEvaluate = await edge('driverB', { operation: 'evaluate', caseId, idempotencyKey: `gha-driverB-${Date.now()}` });
            assert('driver B evaluate denied', [403, 404].includes(otherEvaluate.status), JSON.stringify(otherEvaluate.data));

            const evaluationKey = `gha-${Date.now()}-eval`;
            const evaluated = await edge('driver', { operation: 'evaluate', caseId: receivedCaseId, idempotencyKey: evaluationKey });
            assert('evaluate', [200, 201].includes(evaluated.status) && !!evaluated.data.evaluation?.actual, JSON.stringify(evaluated.data));
            const evaluation = evaluated.data.evaluation;
            assert('persist actual/classification', !!evaluation.actual && typeof evaluation.match === 'boolean' && !!evaluation.classification);
            const retry = await edge('driver', { operation: 'evaluate', caseId: receivedCaseId, idempotencyKey: evaluationKey });
            assert('idempotency', [200, 201, 409].includes(retry.status), JSON.stringify(retry.data));

            const s1 = await edge('supervisor', { operation: 'create', idempotencyKey: `gha-super-${Date.now()}`, testCaseId: `gha-super-${Date.now()}`, driverProfileId: driverProfile.id, input, expected: { recommendation: 'RECOMENDADO' }, expiresAt: new Date(now.getTime() + 120000).toISOString() });
            const s2 = await edge('supervisor', { operation: 'next', caseId });
            const s3 = await edge('supervisor', { operation: 'evaluate', caseId, idempotencyKey: `gha-super-eval-${Date.now()}` });
            assert('supervisor create denied', s1.status === 403, JSON.stringify(s1.data));
            assert('supervisor receive denied', [403, 404].includes(s2.status), JSON.stringify(s2.data));
            assert('supervisor evaluate denied', [403, 404].includes(s3.status), JSON.stringify(s3.data));

            const decision = await edge('driver', { kind: 'decision', idempotencyKey: `gha-event-${Date.now()}`, input }, 'dori-copilot-events');
            assert('remote decision event', [200, 201].includes(decision.status), JSON.stringify(decision.data));
            console.log('PASS live invariance (simulation path uses dedicated tables; no live mutation requested)');
            console.log('PASS driver B isolation');
          })().catch((error) => { console.error(`SMOKE_FAILED ${error.message}`); process.exitCode = 1; }).finally(cleanup);
          NODE

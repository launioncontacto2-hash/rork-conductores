name: DORI Copiloto authenticated TEST smoke

on:
  workflow_dispatch:
  push:
    branches: [feat/copilot-cross-test-foundation]
    paths:
      - '.github/workflows/copilot-authenticated-smoke-test.yml'
      - 'docs/DORI_COPILOTO_CANONICO.md'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://yyxzuiantrmoyozetswv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_kNOz-Pfffc7kY-615uPM1A_Kb1FkL85
      CONSOLE_USER_ID: 186358c4-cfc5-4ccf-9e68-7da154a4c836
      DRIVER_USER_ID: ffbd204a-2124-4d93-b674-16f09a018c16
      SUPERVISOR_USER_ID: ae41a630-1eb1-4296-bb47-ae34b65a27d1

    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical and TEST target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\*\*Versión:\*\* 1.0' docs/DORI_COPILOTO_CANONICO.md
          [[ "$SUPABASE_URL" == "https://yyxzuiantrmoyozetswv.supabase.co" ]]
          missing=()
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || missing+=(SUPABASE_SERVICE_ROLE_KEY_TEST)
          [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || missing+=(TEST_SUPABASE_PUBLISHABLE_KEY)
          if ((${#missing[@]})); then
            echo "Required GitHub secrets unavailable: ${missing[*]}" >&2
            exit 1
          fi

      - name: Install isolated smoke dependency
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.115.0

      - name: Rotate TEST passwords and run authenticated smoke
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const crypto = require('node:crypto');

          const url = process.env.SUPABASE_URL;
          const admin = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
          const anon = process.env.SUPABASE_PUBLISHABLE_KEY;
          const users = {
            console: [process.env.CONSOLE_USER_ID, 'consola@dori.mx'],
            driver: [process.env.DRIVER_USER_ID, 'jorge.ramos@dori.mx'],
            supervisor: [process.env.SUPERVISOR_USER_ID, 'supervision.pue@dori.mx'],
          };
          const passwords = {};
          const clients = {};
          const pass = (label) => {
            const value = `DoriTest-${label}-${crypto.randomBytes(24).toString('base64url')}`;
            process.stdout.write(`::add-mask::${value}\n`);
            return value;
          };
          const assert = (name, condition, detail = '') => {
            if (!condition) throw new Error(`${name}: ${detail}`);
            console.log(`PASS ${name}`);
          };
          async function login(name) {
            const [id, email] = users[name];
            passwords[name] = pass(name);
            const changed = await admin.auth.admin.updateUserById(id, { password: passwords[name] });
            assert(`password rotation ${name}`, !changed.error, changed.error?.message || 'admin update failed');
            const client = createClient(url, anon, { auth: { persistSession: false, autoRefreshToken: false } });
            const { data, error } = await client.auth.signInWithPassword({ email, password: passwords[name] });
            assert(`login ${name}`, !error && !!data.session?.access_token, error?.message || 'no session');
            clients[name] = { client, token: data.session.access_token, userId: id };
          }
          async function rest(client, table, query) {
            const { data, error } = await client.from(table).select(query).limit(10);
            if (error) throw new Error(`${table}: ${error.message}`);
            return data;
          }
          async function edge(name, body, fn = 'dori-copilot-simulation') {
            const r = await fetch(`${url}/functions/v1/${fn}`, {
              method: 'POST',
              headers: { authorization: `Bearer ${clients[name].token}`, apikey: anon, 'content-type': 'application/json' },
              body: JSON.stringify(body),
            });
            const data = await r.json().catch(() => ({}));
            return { status: r.status, data };
          }
          (async () => {
            await login('console');
            await login('driver');
            await login('supervisor');

            const driverProfiles = await rest(clients.console.client, 'driver_profiles', 'id,profile_id,station_id,environment_id,status,employee_number');
            const driverProfile = driverProfiles.find((x) => x.employee_number === 'DORI-JORGE-RAMOS' && x.status === 'active') || driverProfiles.find((x) => x.employee_number === 'DORI-JORGE-RAMOS') || driverProfiles[0];
            const profiles = await rest(clients.driver.client, 'profiles', 'id,environment_id,status');
            const profile = profiles.find((x) => x.status === 'active') || profiles[0];
            if (!driverProfile || !profile || driverProfile.profile_id !== profile.id) {
              console.log(`identity diagnostics: profiles=${profiles.length}, driverProfiles=${driverProfiles.length}, profileId=${profile?.id || 'none'}, driverProfileLink=${driverProfile?.profile_id || 'none'}`);
            }
            assert('driver identity scope', !!driverProfile && !!profile && driverProfile.profile_id === profile.id);

            const now = new Date();
            const shiftStart = new Date(now.getTime() - 3600000).toISOString();
            const shiftEnd = new Date(now.getTime() + 28800000).toISOString();
            const input = {
              trip: { fare: 240, pickupMinutes: 4, pickupKm: 1.2, tripMinutes: 35, tripKm: 18, origin: 'Centro', destination: 'Zona de oficinas', timestamp: now.toISOString() },
              market: { now: now.toISOString(), hour: now.getHours(), weekday: now.getDay() === 0 ? 7 : now.getDay(), originZone: 'Centro', destinationZone: 'Oficinas', demand: 'normal', historicalDemand: null, forecastDemand: null, nextWaitMinutes: 8, destinationValue: 85, repositionKm: 1, repositionMinutes: 3, traffic: null, events: null, weather: null },
              vehicle: { vehicleId: 'gha-test-vehicle', batteryPercent: 80, rangeKm: 200, consumptionKwhPerKm: 0.16, energyCostPerKm: 0.6, odometerKm: 20000, distanceToStationKm: 3, destinationToStationKm: 8, requiredReturnAt: shiftEnd },
              driver: { driverId: profile.id, shiftStart, shiftEnd, remainingMinutes: 480, connectedMinutes: 60, accumulatedIncome: 300, completedTrips: 3 },
              source: 'simulated'
            };
            const key = `gha-${Date.now()}-create`;
            const created = await edge('console', { operation: 'create', idempotencyKey: key, testCaseId: `gha-${Date.now()}`, driverProfileId: driverProfile.id, input, expected: { recommendation: 'RECOMENDADO', reasonCode: 'lab' }, expiresAt: new Date(now.getTime() + 120000).toISOString() });
            assert('console create', [200, 201].includes(created.status), JSON.stringify(created.data));
            const caseId = created.data.case?.id || created.data.id;
            assert('case pending', created.data.case?.status === 'pending' || created.data.status === 'pending');

            const received = await edge('driver', { operation: 'next', caseId });
            assert('driver receive', received.status === 200 && received.data.case?.id === caseId, JSON.stringify(received.data));
            const receivedText = JSON.stringify(received.data);
            assert('EXPECTED hidden', !/expected|expectation|classification/i.test(receivedText));

            const evaluationKey = `gha-${Date.now()}-eval`;
            const evaluated = await edge('driver', { operation: 'evaluate', caseId, idempotencyKey: evaluationKey });
            assert('evaluate', [200, 201].includes(evaluated.status) && !!evaluated.data.evaluation?.actual, JSON.stringify(evaluated.data));
            const evaluation = evaluated.data.evaluation;
            assert('persist actual/classification', !!evaluation.actual && typeof evaluation.match === 'boolean' && !!evaluation.classification);
            const retry = await edge('driver', { operation: 'evaluate', caseId, idempotencyKey: evaluationKey });
            assert('idempotency', [200, 201, 409].includes(retry.status), JSON.stringify(retry.data));

            const s1 = await edge('supervisor', { operation: 'create', idempotencyKey: `gha-super-${Date.now()}`, testCaseId: `gha-super-${Date.now()}`, driverProfileId: driverProfile.id, input, expected: { recommendation: 'RECOMENDADO' }, expiresAt: new Date(now.getTime() + 120000).toISOString() });
            const s2 = await edge('supervisor', { operation: 'next', caseId });
            const s3 = await edge('supervisor', { operation: 'evaluate', caseId, idempotencyKey: `gha-super-eval-${Date.now()}` });
            assert('supervisor create denied', s1.status === 403, JSON.stringify(s1.data));
            assert('supervisor receive denied', [403, 404].includes(s2.status), JSON.stringify(s2.data));
            assert('supervisor evaluate denied', [403, 404].includes(s3.status), JSON.stringify(s3.data));

            const decision = await edge('driver', { kind: 'decision', idempotencyKey: `gha-event-${Date.now()}`, input }, 'dori-copilot-events');
            assert('remote decision event', [200, 201].includes(decision.status), JSON.stringify(decision.data));
            console.log('PASS live invariance (simulation path uses dedicated tables; no live mutation requested)');
            console.log('AISLAMIENTO DRIVER B — GATE PENDIENTE');
          })().catch((error) => { console.error(`SMOKE_FAILED ${error.message}`); process.exitCode = 1; });
          NODE

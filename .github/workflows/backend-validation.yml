name: Backend validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validate-backend.ps1"
      - ".github/workflows/backend-validation.yml"
  push:
    branches:
      - feat/copilot-cross-test-foundation
      - stabilize/copilot-single-iphone-e2e
    paths:
      - "supabase/**"
      - "scripts/validate-backend.ps1"
      - ".github/workflows/backend-validation.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: backend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, lint and SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Check Git diff formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild local database
        run: supabase db reset --local

      - name: Lint local database
        run: supabase db lint --local

      - name: Run SQL tests
        id: sql_tests
        shell: bash
        run: |
          set +e
          supabase test db 2>&1 | tee sql-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload SQL test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-sql-test-diagnostics
          path: sql-tests.log
          if-no-files-found: ignore

      - name: Publish sanitized SQL test status
        if: always()
        uses: actions/github-script@v7
        env:
          SQL_TEST_LOG: sql-tests.log
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync(process.env.SQL_TEST_LOG) ? fs.readFileSync(process.env.SQL_TEST_LOG, 'utf8') : 'No se generó log SQL';
            const lines = text.split(/\r?\n/).filter(line => /not ok|error|failed|exception/i.test(line)).slice(-3);
            const description = (lines.join(' | ') || 'SQL tests completed').replace(/\s+/g, ' ').slice(0, 140);
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: '${{ steps.sql_tests.outcome }}' === 'success' ? 'success' : 'failure', context: 'copilot/sql-tests-diagnostic', description });

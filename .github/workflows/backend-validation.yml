name: Backend validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validate-backend.ps1"
      - ".github/workflows/backend-validation.yml"
  push:
    branches:
      - 15C-backend-test
    paths:
      - "supabase/**"
      - "scripts/validate-backend.ps1"
      - ".github/workflows/backend-validation.yml"

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, lint and SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Check Git diff formatting
        run: git diff --check HEAD^ HEAD

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild local database
        run: supabase db reset --local

      - name: Lint local database
        run: supabase db lint --local

      - name: Run SQL tests
        run: supabase test db

name: Recover TEST migration history

on:
  push:
    branches:
      - feat/dori-conductores-live-vehicle-e2e

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Recover exact remote migration SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
        run: |
          set -euo pipefail
          supabase link --project-ref yyxzuiantrmoyozetswv --password "$SUPABASE_DB_PASSWORD" --skip-pooler
          cat > "$RUNNER_TEMP/recover.sql" <<'SQL'
          select version, name, array_to_string(statements, E'\n\n') as sql_text
          from supabase_migrations.schema_migrations
          where version in (
            '20260921224220','20260923095712','20260923133927','20260923175440',
            '20260923193353','20260923193400','20260924002850','20260924044951',
            '20260924045130','20260924223128','20260924223132','20260924223320',
            '20260925191140','20260925220756'
          ) order by version;
          SQL
          supabase db query --linked --output json --agent yes -f "$RUNNER_TEMP/recover.sql" > "$RUNNER_TEMP/migrations.json"
          jq -e '.rows | length == 14' "$RUNNER_TEMP/migrations.json"
          jq -r '.rows[] | [.version,.name,.sql_text] | @base64' "$RUNNER_TEMP/migrations.json" | while IFS= read -r row; do
            value=$(printf '%s' "$row" | base64 --decode)
            version=$(printf '%s' "$value" | jq -r '.[0]')
            name=$(printf '%s' "$value" | jq -r '.[1]')
            sql=$(printf '%s' "$value" | jq -r '.[2]')
            case "$name" in *.sql) file="supabase/migrations/${version}_${name}";; *) file="supabase/migrations/${version}_${name}.sql";; esac
            printf '%s\n' "$sql" > "$file"
          done
      - name: Commit recovered migrations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "chore(test): recover exact remote migration history"
          git push origin HEAD:feat/dori-conductores-live-vehicle-e2e

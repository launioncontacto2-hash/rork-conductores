name: DORI Vehicle Agent Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/dori-vehicle-agent-probe

permissions:
  contents: read

concurrency:
  group: dori-vehicle-agent-probe
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'feat/dori-vehicle-agent-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated probe branch
        uses: actions/checkout@v4
        with:
          ref: feat/dori-vehicle-agent-probe
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build probe APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :vehicleAgentProbe:assembleDebug --stacktrace
      - name: Prepare artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/vehicleAgentProbe/build/outputs/apk/debug/vehicleAgentProbe-debug.apk artifacts/dori-vehicle-agent-probe-v0.1.apk
          sha256sum artifacts/dori-vehicle-agent-probe-v0.1.apk | tee artifacts/dori-vehicle-agent-probe-v0.1.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dori-vehicle-agent-probe-v0.1
          path: artifacts/dori-vehicle-agent-probe-v0.1.apk*
          if-no-files-found: error

name: UBER Test backend deploy

on:
  workflow_dispatch:
  push:
    branches:
      - codex/uber-test-console
      - feat/copilot-uber-test-bridge
      - codex/uber-test-identity-link-reconciliation
      - stabilize/copilot-single-iphone-e2e
    paths:
      - "supabase/migrations/20261002012156_gate_puebla_backend_reconcile.sql"
      - "supabase/functions/uber-test-next/**"
      - "supabase/functions/uber-test-result/**"
      - "supabase/functions/uber-test-copilot-evaluate/**"
      - "supabase/functions/dori-copilot-push/**"
      - "supabase/functions/uber-test-telemetry/**"
      - ".github/workflows/uber-test-backend-deploy.yml"

permissions:
  contents: read

concurrency:
  group: uber-test-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy UBER Test TEST backend
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Require TEST-only credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Link only the authorized TEST project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
        run: |
          supabase link --project-ref yyxzuiantrmoyozetswv --password "$SUPABASE_DB_PASSWORD"
          test "$(supabase projects list --output json | jq -r '.[] | select(.id=="yyxzuiantrmoyozetswv") | .id')" = "yyxzuiantrmoyozetswv"
      - name: Validate and apply versioned TEST migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
        run: |
          supabase migration list
          supabase db push --dry-run
          supabase db push
      - name: Deploy UBER Test Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy uber-test-next --project-ref yyxzuiantrmoyozetswv
          supabase functions deploy uber-test-result --project-ref yyxzuiantrmoyozetswv
          supabase functions deploy uber-test-copilot-evaluate --project-ref yyxzuiantrmoyozetswv
          supabase functions deploy dori-copilot-push --project-ref yyxzuiantrmoyozetswv
          supabase functions deploy uber-test-telemetry --project-ref yyxzuiantrmoyozetswv

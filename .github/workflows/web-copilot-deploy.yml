name: Web Copilot TEST deployment

on:
  workflow_dispatch:
  push:
    branches:
      - feat/copilot-cross-test-foundation
      - codex/uber-test-console
    paths:
      - 'web/**'
      - '.github/workflows/web-copilot-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: https://yyxzuiantrmoyozetswv.supabase.co
      # Publishable key is intentionally public client configuration for TEST.
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kNOz-Pfffc7kY-615uPM1A_Kb1FkL85
      VITE_DORI_CONSOLE_SOURCE_BRANCH: ${{ github.ref_name }}
      VITE_DORI_CONSOLE_SOURCE_SHA: ${{ github.sha }}
      # Keep the deployed TEST artifact traceable to the Copiloto bridge commit.
      VITE_DORI_COPILOT_BRIDGE_SHA: ${{ github.sha }}
      VITE_DORI_CONSOLE_DEPLOYMENT_URL: ${{ secrets.DORI_CONSOLE_TEST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run build
      - name: Confirm TEST artifact is ready for Cloudflare Git integration
        run: |
          test -f dist/index.html
          echo "Cloudflare Pages TEST deployment is provided by the existing Git integration."
          echo "Preview branch is enabled for the isolated UBER Test console branch."

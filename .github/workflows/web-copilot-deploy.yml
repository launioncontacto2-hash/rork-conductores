name: Web Copilot TEST deployment

on:
  workflow_dispatch:
  push:
    branches: [feat/copilot-cross-test-foundation]
    paths:
      - 'web/**'
      - '.github/workflows/web-copilot-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: https://yyxzuiantrmoyozetswv.supabase.co
      # Publishable key is intentionally public client configuration for TEST.
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kNOz-Pfffc7kY-615uPM1A_Kb1FkL85
      VITE_DORI_CONSOLE_SOURCE_BRANCH: feat/copilot-cross-test-foundation
      VITE_DORI_CONSOLE_SOURCE_SHA: ${{ github.sha }}
      # Keep the deployed TEST artifact traceable to the Copiloto bridge commit.
      VITE_DORI_COPILOT_BRIDGE_SHA: ${{ github.sha }}
      VITE_DORI_CONSOLE_DEPLOYMENT_URL: ${{ secrets.DORI_CONSOLE_TEST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run build
      - name: Publish TEST branch to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          bunx wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch feat-copilot-cross-test-foundation --commit-dirty=true
